[platformio]
default_envs = uno_q

[env:uno_q]
platform = ststm32
board = arduino_uno_q
framework = arduino

; STM32 Cortex-M4 at 80MHz
board_build.mcu = stm32l496ag
board_build.f_cpu = 80000000L

; Optimization for real-time performance
build_flags = 
    -O2
    -DUSE_HAL_DRIVER
    -DSTM32L496xx
    -DREAL_TIME_PRIORITY
    -Wall
    -Wextra

; Serial communication with Snapdragon core
monitor_speed = 115200

; Library dependencies
lib_deps =
    Wire                    ; I2C for BME688
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BME680 Library@^2.0.4

; Upload configuration
upload_protocol = stlink
upload_speed = 115200

; Debugging
debug_tool = stlink
debug_init_break = tbreak setup
